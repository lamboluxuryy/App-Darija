<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0035"/>
      <stop offset="40%" stop-color="#2d0060"/>
      <stop offset="100%" stop-color="#0d1840"/>
    </linearGradient>
    <linearGradient id="star1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="star2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="256" cy="240" rx="180" ry="160" fill="rgba(212,140,0,0.07)"/>
  <g transform="translate(256,256)" filter="url(#glow)">
    <rect x="-110" y="-110" width="220" height="220" rx="12" fill="url(#star1)" opacity="0.9" transform="rotate(0)"/>
    <rect x="-110" y="-110" width="220" height="220" rx="12" fill="url(#star1)" opacity="0.9" transform="rotate(45)"/>
    <circle r="76" fill="#0d0020"/>
    <rect x="-48" y="-48" width="96" height="96" fill="url(#star2)" opacity="0.85" transform="rotate(45)"/>
    <circle r="42" fill="#0d0020"/>
    <text text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="52" font-weight="700" fill="#FFD700" dy="3">د</text>
  </g>
  <circle cx="60" cy="60" r="7" fill="rgba(212,175,55,0.25)"/>
  <circle cx="452" cy="60" r="7" fill="rgba(212,175,55,0.25)"/>
  <circle cx="60" cy="452" r="7" fill="rgba(212,175,55,0.25)"/>
  <circle cx="452" cy="452" r="7" fill="rgba(212,175,55,0.25)"/>
</svg>
